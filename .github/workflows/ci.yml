name: Reproducibility CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Sunday 03:00 UTC. The weekly job replays every entry that fits a CI budget,
    # so drift in an entry outside the push-time subset is still caught.
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:

  # ── v3 reproducibility: replay two committed entries ──────────────────────
  verify-v3:
    name: Verify 2 benchmark entries (H2 + HF, 6-31G)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip (v3)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v3-${{ hashFiles('requirements-v3.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v3-

      - name: Install v3 dependencies
        run: pip install -r requirements-v3.txt

      # --tolerance 1e-8 Ha is 7 orders of magnitude stricter than the 0.01 Ha
      # certification threshold. We use it (rather than exact SHA-256) because
      # GitHub's python-version: "3.11" may resolve to a different 3.11.x patch
      # than the one used at certification. Exact hash verification can be run
      # locally with matching tool versions (see docs/VERIFY.md).
      - name: Verify H2 (JW / UCCSD / 6-31G)
        run: |
          python scripts/verify_entry.py \
            releases/v3.1/db/H2_631g_JW_UCCSD_v3_tapered__sha256_c311a3dfdda0df10.json \
            --tolerance 1e-8

      - name: Verify HF (JW / UCCSD / 6-31G)
        run: |
          python scripts/verify_entry.py \
            releases/v3.1/db/HF_631g_JW_UCCSD_v3_tapered__sha256_027087b777a912eb.json \
            --tolerance 1e-8

  # ── v4 smoke test: generate H2 + HF entries fresh and certify ────────────
  # Generates new entries from scratch (no committed v4 entries needed) to
  # verify the full v4 pipeline: PySCF cc-pVDZ → PL 0.45 → JW tapering → VQE.
  # H2 [2e,2o] and HF [2e,2o] are fast (< 5 min each); multistart=3 is enough
  # to reach the 0.01 Ha certification threshold reliably.
  smoke-v4:
    name: Smoke test v4 generator (H2 + HF, cc-pVDZ)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip (v4)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v4-${{ hashFiles('requirements-v4.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v4-

      - name: Install v4 dependencies
        run: pip install -r requirements-v4.txt

      - name: Generate and certify H2 (JW / UCCSD / cc-pVDZ)
        run: |
          mkdir -p /tmp/v4_ci
          python scripts/generate_entry_v4.py \
            --molecule H2 \
            --mapping jordan_wigner \
            --ansatz-type uccsd \
            --basis cc-pvdz \
            --multistart 3 \
            --seed 42 \
            --out-dir /tmp/v4_ci
          python - <<'PYEOF'
          import json, sys, pathlib
          entries = list(pathlib.Path("/tmp/v4_ci").glob("H2_ccpvdz_JW_UCCSD_*.json"))
          if not entries:
              print("ERROR: no H2 entry generated"); sys.exit(1)
          e = json.loads(entries[0].read_text())
          gap = e["results"]["quality"]["abs_vqe_exact_gap"]
          trusted = e["results"]["quality"]["trusted"]
          print(f"H2 JW/UCCSD gap: {gap:.3e} Ha  certified={trusted}")
          if not trusted:
              print(f"FAIL: gap {gap:.3e} Ha exceeds 0.01 Ha threshold"); sys.exit(1)
          print("PASS")
          PYEOF

      - name: Generate and certify HF (JW / UCCSD / cc-pVDZ)
        run: |
          python scripts/generate_entry_v4.py \
            --molecule HF \
            --mapping jordan_wigner \
            --ansatz-type uccsd \
            --basis cc-pvdz \
            --multistart 3 \
            --seed 42 \
            --out-dir /tmp/v4_ci
          python - <<'PYEOF'
          import json, sys, pathlib
          entries = list(pathlib.Path("/tmp/v4_ci").glob("HF_ccpvdz_JW_UCCSD_*.json"))
          if not entries:
              print("ERROR: no HF entry generated"); sys.exit(1)
          e = json.loads(entries[0].read_text())
          gap = e["results"]["quality"]["abs_vqe_exact_gap"]
          trusted = e["results"]["quality"]["trusted"]
          print(f"HF JW/UCCSD gap: {gap:.3e} Ha  certified={trusted}")
          if not trusted:
              print(f"FAIL: gap {gap:.3e} Ha exceeds 0.01 Ha threshold"); sys.exit(1)
          print("PASS")
          PYEOF

  # ── v4 reproducibility: replay committed entries ──────────────────────────
  #
  # Added after the first end-to-end sweep of the database found that
  # scripts/verify_entry.py could not re-run 29 of the 54 published entries at
  # all, and re-ran 3 more at the wrong iteration budget. Both faults were in
  # the verifier, not in the results, and neither was visible because nobody had
  # ever run it across everything. See docs/VERIFICATION_SWEEP.md.
  #
  # The point of this job is that those two bugs cannot come back unnoticed.
  verify-v4-subset:
    name: Verify v4 entries (regression subset)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip (v4)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v4-${{ hashFiles('requirements-v4.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v4-

      - name: Install v4 dependencies
        run: pip install -r requirements-v4.txt

      # Each entry below is here for a stated reason. Measured verification times
      # come from experiments/verification_sweep/; the whole job is about a minute
      # of compute on the reference machine.

      # Regression for the ansatz-vocabulary bug: entries store ansatz_type "hea"
      # while the CLI accepts only "hardware_efficient". This is 29 of 54 entries,
      # and before a298c51 every one of them failed at the first call.
      - name: HEA entry — regression for the ansatz vocabulary bug
        run: python scripts/verify_entry.py releases/v4/db/HF_ccpvdz_JW_HEA_v4_tapered__sha256_94244108ad3c4f44.json

      # Regression for the max_iterations bug: entries recorded above the
      # generator's 500 default were silently re-run at 500 and landed elsewhere.
      # Every entry at 500 reproduced; all three above it failed. This is one of
      # the three, and the only one cheap enough for CI.
      - name: max_iterations=1000 entry — regression for the iteration-budget bug
        run: python scripts/verify_entry.py releases/v4/db/H4_ccpvdz_JW_UCCSD_v4_tapered__sha256_7606caf47ff39f40.json

      # One of each remaining ansatz family, so a change to circuit construction
      # is caught rather than only a change to argument plumbing.
      - name: UCCSD entry
        run: python scripts/verify_entry.py releases/v4/db/H2_ccpvdz_JW_UCCSD_v4_tapered__sha256_93a0f8a8604d9aed.json

      - name: ADAPT entry
        run: python scripts/verify_entry.py releases/v4/db/H4_ccpvdz_JW_ADAPT_v4_tapered__sha256_39f9134a722ad612.json

      # Non-Jordan-Wigner mappings, which have their own tapering paths.
      - name: Parity mapping entry
        run: python scripts/verify_entry.py releases/v4/db/HF_ccpvdz_PAR_HEA_v4_tapered__sha256_007a1905c579328a.json

      - name: Bravyi-Kitaev mapping entry
        run: python scripts/verify_entry.py releases/v4/db/H2_ccpvdz_BK_HEA_v4_tapered__sha256_6e206ec6f1f02ea4.json

  # ── v4 reproducibility: the whole database, weekly ────────────────────────
  #
  # The subset above guards against regressions on every push. This runs
  # everything that fits in a CI budget, once a week, so drift in an entry that
  # is not in the subset is still caught.
  #
  # THIS JOB RUNS IN CERTIFICATION MODE, NOT STRICT MODE, AND THAT IS DELIBERATE.
  #
  # A gradient-free optimiser picks its next step by comparing two nearly equal
  # energies, so a last-bit arithmetic difference can flip a comparison and send
  # the run to a different local minimum. Two simulator backends agreeing to
  # 1e-13 Ha landed 11 mHa apart after COBYLA; a different machine is a larger
  # perturbation than that. Measured across a drifted environment, published
  # energies move by up to ~1e-3 Ha -- while every entry still certifies.
  #
  # So this job asserts the property that should hold across machines: the
  # regenerated entry still meets the certification threshold. Energy movement is
  # reported but not gated on. Bit-level energy agreement is a guarantee of the
  # reference pinned environment and is checked there, by tools/verify_sweep.sh.
  #
  # The first run of this job (2026-08-30) failed all four shards for exactly this
  # reason, asserting a guarantee the numerics do not support across machines.
  #
  # A stricter gradient-based-only job would be immune to that amplification, but
  # is not possible here: all seven gradient-based entries are the heavy CASSCF
  # and large-system runs, 20 minutes to 2.1 hours each, and none fits CI.
  #
  # 40 of 54 entries are included. The other 14 are the CASSCF and ADAPT runs on
  # N2, H6, H8, H10 and benzene, which take 5 minutes to over two hours each on
  # the reference machine and would not fit a 6-hour job. They are listed with
  # their measured times at the top of .github/verify_ci_entries.txt and are
  # verified on the cluster instead. Omitting them silently would be worse than
  # saying so.
  verify-v4-full:
    name: Verify v4 entries (full, weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip (v4)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v4-${{ hashFiles('requirements-v4.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v4-

      - name: Install v4 dependencies
        run: pip install -r requirements-v4.txt

      # The manifest is ordered slowest first, so round-robin dealing across four
      # shards balances them without needing per-entry times here.
      - name: Verify shard ${{ matrix.shard }} of 4 (certification mode)
        run: |
          set -u
          mapfile -t ALL < <(grep -v '^#' .github/verify_ci_entries.txt | grep -v '^$')
          # Entries already measured to fail re-certification on another environment.
          # They are certified close to the threshold and a different machine moves them
          # across it. That is a property of those entries, recorded in
          # tools/certification_margin.py and docs/VERIFICATION_SWEEP.md, not a
          # regression -- so they are reported as warnings and do not fail the job. Any
          # entry NOT on this list that stops certifying is a real regression.
          mapfile -t FRAGILE < <(python tools/certification_margin.py --list-measured-fragile)
          echo "manifest holds ${#ALL[@]} entries; this shard takes every 4th from index ${{ matrix.shard }}"
          echo "known environment-fragile entries: ${#FRAGILE[@]}"
          FAILED=0
          KNOWN=0
          COUNT=0
          for i in "${!ALL[@]}"; do
            if [ $(( i % 4 )) -ne ${{ matrix.shard }} ]; then continue; fi
            E="releases/v4/db/${ALL[$i]}"
            COUNT=$(( COUNT + 1 ))
            IS_FRAGILE=0
            for g in "${FRAGILE[@]:-}"; do
              [ "$g" = "${ALL[$i]}" ] && IS_FRAGILE=1
            done
            echo "::group::${ALL[$i]}"
            if python scripts/verify_entry.py "$E" --mode certification; then
              echo "  still certifies"
            elif [ "$IS_FRAGILE" -eq 1 ]; then
              echo "::warning title=Known environment-fragile entry::${ALL[$i]} did not re-certify. This is recorded, not a regression."
              KNOWN=$(( KNOWN + 1 ))
            else
              echo "::error title=Entry stopped certifying::${ALL[$i]}"
              FAILED=$(( FAILED + 1 ))
            fi
            echo "::endgroup::"
          done
          echo "shard ${{ matrix.shard }}: $COUNT entries, $KNOWN known-fragile, $FAILED unexpected failures"
          exit $FAILED
